<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Search Bar</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            

        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;

        }
        #container{
            width: 60vw;
            height: 200px;
            padding:30px 40px;
            border: 2px solid black;
            
        }
        #search{
            font-size: 20px;
            height: 2em;
            border: 3px solid red;
            width: 15%;
            transition: all 0.3s ;
            border-radius: 6px;
            line-height: 100em;
            min-width: 100px;


        
        }
        

        #search:focus{
              border-color:  green;
              width: 100%;
              outline: none;
        }
        #search:focus::placeholder{
            color: transparent;
        }


    </style>
</head>
<body>
    <div id="container">
        <input type="text" id="search"  placeholder="Search...">
    </div>
</body>
</html>
