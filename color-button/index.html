<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Button</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        html,body{
            box-sizing: border-box;
            
        }
        #main{
            height:100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container button{
            background-color: black;
            font-size: 20px;
            width: 12vw;
            color:rgb(214, 210, 210);
            height: 4vw;
            border: none;
            letter-spacing: 0.1rem;
            border-radius: 10px;
        }
        #container button:hover{

            font-size: 20px;
            color:white;
            font-weight: 700;
            width: 14vw;
            height: 6vw;
            border-radius: 10px;
        }
        #container{
            background: linear-gradient(115deg, red, green);
            padding: 4px;
            border-radius: 10px;
        
        }
        #container:hover{
            background: linear-gradient(115deg, green, red);
            padding: 4px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <div id="main">
        <div id="container">
        
    
        <button>Start Coding !!</button>
        </div>
    </div>   
</body>
</html>
